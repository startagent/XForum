name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker (API + Static)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Ensure D1 database exists
        run: |
          set -euo pipefail
          DB_ID=$(npx wrangler d1 list --json | node -e '
            let input = "";
            process.stdin.on("data", c => input += c);
            process.stdin.on("end", () => {
              const list = JSON.parse(input);
              const db = Array.isArray(list) ? list.find(item => item.name === "cforum-db") : null;
              process.stdout.write(db?.uuid ?? "");
            });
          ')
          if [ -z "$DB_ID" ]; then
            echo "🆕 Creating D1 database cforum-db..."
            npx wrangler d1 create cforum-db
            DB_ID=$(npx wrangler d1 list --json | node -e '
              let input = "";
              process.stdin.on("data", c => input += c);
              process.stdin.on("end", () => {
                const list = JSON.parse(input);
                const db = Array.isArray(list) ? list.find(item => item.name === "cforum-db") : null;
                process.stdout.write(db?.uuid ?? "");
              });
            ')
          fi
          sed -i -E "s/\"database_id\": \"[^\"]+\"/\"database_id\": \"$DB_ID\"/" wrangler.jsonc
          echo "✅ D1 database id: $DB_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy Worker (API + static assets)
        uses: cloudflare/wrangler-action@v3.8.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      - name: Upload secrets (optional)
        run: |
          if [ -n "$JWT_SECRET" ]; then
            npx wrangler secret put JWT_SECRET <<< "$JWT_SECRET"
            echo "✅ JWT_SECRET uploaded"
          fi
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            npx wrangler secret put TURNSTILE_SITE_KEY <<< "$TURNSTILE_SITE_KEY"
            npx wrangler secret put TURNSTILE_SECRET_KEY <<< "$TURNSTILE_SECRET_KEY"
            echo "✅ Turnstile uploaded"
          fi
          if [ -n "$BASE_URL" ]; then
            npx wrangler secret put BASE_URL <<< "$BASE_URL"
            echo "✅ BASE_URL uploaded"
          fi
          if [ -n "$SMTP_HOST" ]; then
            npx wrangler secret put SMTP_HOST <<< "$SMTP_HOST"
            npx wrangler secret put SMTP_PORT <<< "$SMTP_PORT"
            npx wrangler secret put SMTP_USER <<< "$SMTP_USER"
            npx wrangler secret put SMTP_PASS <<< "$SMTP_PASS"
            npx wrangler secret put SMTP_FROM <<< "$SMTP_FROM"
            npx wrangler secret put SMTP_FROM_NAME <<< "$SMTP_FROM_NAME"
            echo "✅ SMTP uploaded"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}

      - name: Run D1 Migrations
        run: |
          echo "🔄 Running D1 migrations..."
          for migration in migrations/*.sql; do
            echo "📄 Applying: $migration"
            npx wrangler d1 execute cforum-db --remote --file="$migration" --yes || true
          done
          echo "✅ Migrations complete"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Success
        run: |
          echo "✅ 部署完成！"
          echo "📍 Worker: https://cforum.workers.dev (API + 静态文件)"
          echo "💡 单 Worker 架构，API 和前端都从 workers.dev 提供"
